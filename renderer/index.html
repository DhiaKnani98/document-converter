<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>Convertisseur PDF/Word</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f1f5f9;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --border2:   #cbd5e1;
      --primary:   #1d4ed8;
      --primary-h: #1e40af;
      --danger:    #dc2626;
      --success:   #16a34a;
      --warn:      #d97706;
      --text:      #0f172a;
      --muted:     #64748b;
      --radius:    8px;
      --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .logo { font-size: 18px; }
    header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
    header .subtitle { font-size: 11px; color: var(--muted); margin-left: auto; }

    /* ── Deps banner ── */
    #depsBanner {
      display: none;
      padding: 8px 20px;
      font-size: 12px;
      font-weight: 500;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    #depsBanner.visible { display: flex; }
    #depsBanner.warn { background: #fef9c3; border-bottom: 1px solid #fde047; color: #713f12; }
    #depsBanner.error { background: #fee2e2; border-bottom: 1px solid #fca5a5; color: #7f1d1d; }
    .dep-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px; font-size: 11px;
    }
    .dep-badge.ok  { background: #dcfce7; color: var(--success); }
    .dep-badge.bad { background: #fee2e2; color: var(--danger); }

    /* ── Main layout ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ── Direction toggle ── */
    .toggle-row { display: flex; gap: 8px; }
    .toggle-btn {
      flex: 1;
      padding: 9px 12px;
      border: 2px solid var(--border2);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .toggle-btn:hover { border-color: var(--primary); color: var(--primary); }
    .toggle-btn.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary);
    }
    .toggle-btn .ext-from { font-size: 11px; font-weight: 600; opacity: .7; }

    /* ── Drop zone ── */
    #dropZone {
      border: 2px dashed var(--border2);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
    }
    #dropZone:hover, #dropZone.drag-over {
      border-color: var(--primary);
      background: #eff6ff;
    }
    #dropZone .drop-icon { font-size: 28px; margin-bottom: 8px; }
    #dropZone p { color: var(--muted); font-size: 13px; line-height: 1.5; }
    #dropZone p strong { color: var(--text); }
    #dropZone .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    #fileInput { display: none; }

    /* ── File list ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px;
    }
    .section-header button {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 11px; padding: 2px 6px; border-radius: 4px;
    }
    .section-header button:hover { background: var(--border); color: var(--text); }

    #fileList {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
    }
    #fileList:empty::after {
      content: 'No files queued';
      display: block;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      padding: 12px 0;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color .1s;
    }
    .file-item.converting { border-color: #93c5fd; background: #f0f9ff; }
    .file-item.done       { border-color: #86efac; background: #f0fdf4; }
    .file-item.error      { border-color: #fca5a5; background: #fff1f2; }

    .file-icon { font-size: 16px; flex-shrink: 0; }
    .file-meta { flex: 1; overflow: hidden; }
    .file-name {
      font-size: 13px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .file-size { font-size: 11px; color: var(--muted); }
    .file-status { font-size: 11px; font-weight: 600; flex-shrink: 0; min-width: 70px; text-align: right; }
    .file-status.pending    { color: var(--muted); }
    .file-status.converting { color: var(--primary); }
    .file-status.done       { color: var(--success); }
    .file-status.error      { color: var(--danger); }
    .file-remove {
      background: none; border: none; color: #94a3b8; cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 4px;
      flex-shrink: 0;
    }
    .file-remove:hover { background: #fee2e2; color: var(--danger); }

    /* ── Output row ── */
    .output-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .output-path-box {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .output-path-box .path-label { font-size: 11px; color: var(--muted); flex-shrink: 0; font-weight: 600; }
    .output-path-box .path-text {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .btn {
      padding: 8px 14px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .15s;
      flex-shrink: 0;
    }
    .btn-outline {
      background: var(--surface);
      border: 1px solid var(--border2);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

    /* ── Convert button ── */
    #convertBtn {
      width: 100%;
      padding: 11px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      background: var(--primary);
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background .15s;
      letter-spacing: -.1px;
    }
    #convertBtn:hover:not(:disabled) { background: var(--primary-h); }
    #convertBtn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Progress bar ── */
    #progressSection { display: none; flex-direction: column; gap: 6px; }
    #progressSection.visible { display: flex; }

    .progress-row { display: flex; align-items: center; justify-content: space-between; }
    .progress-label { font-size: 12px; color: var(--muted); }
    .progress-pct { font-size: 12px; font-weight: 600; color: var(--primary); }

    .progress-track {
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
      transition: width .25s ease;
      width: 0%;
    }
    .progress-fill.done   { background: var(--success); }
    .progress-fill.errors { background: var(--warn); }

    /* ── Results section ── */
    #resultsSection { display: none; flex-direction: column; gap: 8px; }
    #resultsSection.visible { display: flex; }

    .result-summary {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
    }
    .result-summary.all-ok { background: #dcfce7; color: var(--success); }
    .result-summary.has-errors { background: #fef9c3; color: #713f12; }
    .result-summary .open-folder {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid currentColor;
      background: none;
      color: inherit;
    }
    .result-summary .open-folder:hover { opacity: .7; }

    .result-errors {
      display: flex; flex-direction: column; gap: 4px;
    }
    .result-error-item {
      padding: 6px 10px;
      background: #fff1f2;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      font-size: 12px;
      color: var(--danger);
    }
    .result-error-item .err-name { font-weight: 600; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 999px; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <span class="logo">⬡</span>
    <h1>Convertisseur PDF/Word</h1>
  </header>

  <!-- Dependency banner -->
  <div id="depsBanner">
    <span id="depsMessage">Checking dependencies…</span>
    <span id="wordBadge" class="dep-badge">Microsoft Word</span>
  </div>

  <!-- Main content -->
  <main>

    <!-- Direction toggle -->
    <div class="toggle-row">
      <button class="toggle-btn active" id="btnDocxPdf" data-dir="docx-to-pdf">
        <span class="ext-from">DOCX</span>
        <span>→</span>
        <span>PDF</span>
      </button>
      <button class="toggle-btn" id="btnPdfDocx" data-dir="pdf-to-docx">
        <span class="ext-from">PDF</span>
        <span>→</span>
        <span>DOCX</span>
      </button>
    </div>

    <!-- Drop zone -->
    <div id="dropZone">
      <div class="drop-icon">📂</div>
      <p><strong>Drop files here</strong> or click to browse</p>
      <p class="hint" id="dropHint">Accepts .docx files</p>
      <input type="file" id="fileInput" multiple accept=".docx" />
    </div>

    <!-- File queue -->
    <div>
      <div class="section-header">
        <span>Queue (<span id="fileCount">0</span>)</span>
        <button id="clearAllBtn">Clear all</button>
      </div>
    </div>
    <div id="fileList"></div>

    <!-- Output folder -->
    <div class="output-row">
      <div class="output-path-box">
        <span class="path-label">Output</span>
        <span class="path-text" id="outputPathText">Not selected</span>
      </div>
      <button class="btn btn-outline" id="selectOutputBtn">Browse…</button>
    </div>

    <!-- Convert button -->
    <button id="convertBtn" disabled>Convert</button>

    <!-- Progress -->
    <div id="progressSection">
      <div class="progress-row">
        <span class="progress-label" id="progressLabel">Converting…</span>
        <span class="progress-pct" id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Results -->
    <div id="resultsSection">
      <div class="result-summary" id="resultSummary">
        <span id="resultText"></span>
        <button class="open-folder" id="openFolderBtn">Open folder ↗</button>
      </div>
      <div class="result-errors" id="resultErrors"></div>
    </div>

  </main>

  <script src="renderer.js"></script>
</body>
</html>
